<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    @keyframes float1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pulse-opacity {
      0% { opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { opacity: 0.3; }
    }

    .floating-card-1 { animation: float1 6s ease-in-out infinite; }
    .floating-card-2 { animation: float2 8s ease-in-out infinite; }
    .pulsing-node { animation: pulse-opacity 3s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Decorative Background Grid Lines -->
  <g opacity="0.15">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#38bdf8" stroke-width="1" stroke-dasharray="8 8" />
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#818cf8" stroke-width="1" stroke-dasharray="8 8" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#c084fc" stroke-width="1" stroke-dasharray="8 8" />
    <line x1="300" y1="0" x2="300" y2="400" stroke="#38bdf8" stroke-width="1" stroke-dasharray="8 8" />
    <line x1="600" y1="0" x2="600" y2="400" stroke="#818cf8" stroke-width="1" stroke-dasharray="8 8" />
    <line x1="900" y1="0" x2="900" y2="400" stroke="#c084fc" stroke-width="1" stroke-dasharray="8 8" />
  </g>

  <!-- Dynamic Background Graphics (Right Side) -->
  <g class="floating-card-1" opacity="0.5">
    <rect x="900" y="120" width="220" height="140" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <path d="M 920 180 Q 960 140 1000 180 T 1080 160" fill="none" stroke="#38bdf8" stroke-width="3" />
    <circle cx="1000" cy="180" r="8" fill="#38bdf8" class="pulsing-node" />
  </g>

  <g class="floating-card-2" opacity="0.35">
    <rect x="850" y="220" width="180" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="870" y="245" width="80" height="10" rx="5" fill="#818cf8"/>
    <rect x="870" y="265" width="120" height="8" rx="4" fill="#475569"/>
    <rect x="870" y="280" width="100" height="8" rx="4" fill="#475569"/>
  </g>

  <!-- Category Badge Top -->
  <rect x="70" y="55" width="220" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="180" y="76" text-anchor="middle" class="badge-text">2026 ECOSYSTEM GUIDE</text>

  <!-- Main Title and Subtitles -->
  <text x="70" y="145" class="title">Awesome Interactive Collaboration Display</text>
  <text x="70" y="185" fill="url(#accent-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="22px">
    Hardware, SaaS Platforms &amp; Open-Source Whiteboard Ecosystem
  </text>
  
  <text x="70" y="235" class="subtitle">
    Curated benchmarks, real-time whiteboards, interactive displays, pricing &amp; star metrics.
  </text>

  <!-- Bottom Stat Cards -->
  <g transform="translate(70, 285)">
    <rect x="0" y="0" width="160" height="48" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" fill="#94a3b8">HARDWARE &amp; SAAS</text>
    <text x="20" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16px" font-weight="bold" fill="#ffffff">10+ Leaders</text>

    <rect x="180" y="0" width="160" height="48" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="200" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" fill="#94a3b8">OPEN-SOURCE</text>
    <text x="200" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16px" font-weight="bold" fill="#38bdf8">10 Projects</text>

    <rect x="360" y="0" width="160" height="48" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="380" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" fill="#94a3b8">TOP STARS</text>
    <text x="380" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16px" font-weight="bold" fill="#c084fc">130k+ Stars</text>
  </g>
</svg>
