<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(15px) rotate(-1.5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulse-ring {
      0% { r: 35px; opacity: 0.8; }
      50% { r: 45px; opacity: 0.2; }
      100% { r: 35px; opacity: 0.8; }
    }

    .floating-card-1 { animation: float1 6s ease-in-out infinite; }
    .floating-card-2 { animation: float2 8s ease-in-out infinite; }
    .pulsing-node { animation: pulse-ring 3s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Decorative Background Dynamic Grid/Nodes (Strictly Behind Text) -->
  <g opacity="0.25">
    <circle cx="150" cy="100" r="3" fill="#38bdf8" />
    <circle cx="250" cy="320" r="4" fill="#818cf8" />
    <circle cx="1050" cy="80" r="5" fill="#c084fc" />
    <circle cx="980" cy="300" r="3" fill="#38bdf8" />
    <line x1="150" y1="100" x2="250" y2="320" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="1050" y1="80" x2="980" y2="300" stroke="#c084fc" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Animated Dynamic Background Element (Lower Depth) -->
  <g class="floating-card-1" opacity="0.4">
    <rect x="900" y="140" width="220" height="140" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <path d="M 920 180 Q 960 150 1000 190 T 1080 170" fill="none" stroke="#38bdf8" stroke-width="3" />
    <circle cx="1000" cy="190" r="6" fill="#38bdf8" class="pulsing-node" />
  </g>

  <g class="floating-card-2" opacity="0.35">
    <rect x="80" y="180" width="180" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="100" y="205" width="80" height="10" rx="5" fill="#818cf8"/>
    <rect x="100" y="225" width="120" height="8" rx="4" fill="#475569"/>
    <rect x="100" y="240" width="100" height="8" rx="4" fill="#475569"/>
  </g>

  <!-- Main Content Box / Accent Line -->
  <rect x="80" y="60" width="220" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="190" y="81" text-anchor="middle" class="badge-text">⚡ 2026 ECOSYSTEM GUIDE</text>

  <!-- Foreground Title and Subtitle (Ensured High Visibility) -->
  <text x="80" y="150" class="title" filter="url(#glow)">Awesome Interactive Collaboration Display</text>
  <text x="80" y="190" fill="url(#accent-grad)" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22px">
    Hardware, SaaS Platforms & Open-Source Whiteboard Ecosystem
  </text>
  
  <text x="80" y="240" class="subtitle">
    Curated benchmarks, real-time whiteboards, interactive displays, pricing &amp; star metrics.
  </text>

  <!-- Bottom Interactive Stats Badges (Foreground) -->
  <g transform="translate(80, 290)">
    <rect x="0" y="0" width="160" height="48" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="20" font-family="system-ui" font-size="12px" fill="#94a3b8">HARDWARE &amp; SAAS</text>
    <text x="20" y="38" font-family="system-ui" font-size="16px" font-weight="bold" fill="#ffffff">10+ Leaders</text>

    <rect x="180" y="0" width="160" height="48" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="200" y="20" font-family="system-ui" font-size="12px" fill="#94a3b8">OPEN-SOURCE</text>
    <text x="200" y="38" font-family="system-ui" font-size="16px" font-weight="bold" fill="#38bdf8">10 Projects</text>

    <rect x="360" y="0" width="160" height="48" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="380" y="20" font-family="system-ui" font-size="12px" fill="#94a3b8">TOP STARS</text>
    <text x="380" y="38" font-family="system-ui" font-size="16px" font-weight="bold" fill="#c084fc">130k+ Stars</text>
  </g>
</svg>
